    two_items: 0.6068
    three_items: 0.0577
    four_items: 0.1663
    five_items: 0.0306
    six_items: 0.0332
    seven_items: 0.0113
    eight_items: 0.0188
    nine_items: 0.0042
    ten_to_ninety_nine: 0.0633
    hundred_to_nine_ninety_nine: 0.0076
    thousand_plus: 0.0002
  debit_credit_distribution:
    equal: 0.82
    more_debit: 0.07
    more_credit: 0.11
  even_odd_distribution:
    even: 0.88
    odd: 0.12
  source_distribution:
    manual: 0.05
    automated: 0.88
    recurring: 0.05
    adjustment: 0.02
  seasonality:
    month_end_spike: true
    month_end_multiplier: 2.5
    month_end_lead_days: 5
    quarter_end_spike: true
    quarter_end_multiplier: 4.0
    year_end_spike: true
    year_end_multiplier: 6.0
    weekend_activity: 0.1
    holiday_activity: 0.05
    day_of_week_patterns: true
    monday_multiplier: 1.3
    tuesday_multiplier: 1.1
    wednesday_multiplier: 1.0
    thursday_multiplier: 1.0
    friday_multiplier: 0.85
  amounts:
    min_amount: 100.0
    max_amount: 100000.0
    lognormal_mu: 7.0
    lognormal_sigma: 2.5
    decimal_places: 2
    round_number_probability: 0.25
    nice_number_probability: 0.15
  benford:
    enabled: true
    tolerance: 0.05
    exempt_sources:
    - recurring
    - payroll
output:
  mode: flat_file
  output_directory: ./output
  formats:
  - parquet
  compression:
    enabled: true
    algorithm: zstd
    level: 3
  batch_size: 100000
