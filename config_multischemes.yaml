anomaly_injection:
  enabled: true
  rates:
    total_rate: 0.0
    fraud_rate: 0.0
    error_rate: 0.0
    process_rate: 0.0
  # Multi-stage scheme probabilities are SEPARATE from rates.fraud_rate: they are per-period
  # "start a scheme" probabilities (e.g. 0.03 = 3% chance to start embezzlement when the advancer runs).
  # They do not consume or reduce the global fraud_rate.
  multi_stage_schemes:
    enabled: true
    max_concurrent_schemes: 5
    allow_repeat_perpetrators: true
    max_starts_per_company_per_month: 2
    # Calibrated per-type probabilities (sum ≈ 0.08–0.09 per month).
    embezzlement:
      probability: 0.05
      testing_stage:
        duration_months: 2
        amount_min: 100.0
        amount_max: 500.0
        transaction_count_min: 3
        transaction_count_max: 4
        difficulty: hard
      escalation_stage:
        duration_months: 6
        amount_min: 500.0
        amount_max: 2000.0
        transaction_count_min: 3
        transaction_count_max: 4
        difficulty: moderate
      acceleration_stage:
        duration_months: 3
        amount_min: 2000.0
        amount_max: 10000.0
        transaction_count_min: 5
        transaction_count_max: 12
        difficulty: easy
      desperation_stage:
        duration_months: 1
        amount_min: 10000.0
        amount_max: 50000.0
        transaction_count_min: 3
        transaction_count_max: 6
        difficulty: trivial
    revenue_manipulation:
      probability: 0.05
      early_recognition_target: 0.02
      expense_deferral_target: 0.03
      reserve_release_target: 0.02
      channel_stuffing_target: 0.05
    kickback:
      probability: 0.05
      inflation_min: 0.2
      inflation_max: 0.4
      kickback_percent: 0.5
      setup_months: 2
      operation_months: 5
      kickback_payments_months: 3
      concealment_months: 2
      # Lower = fewer JEs per scheme (probability per day to emit one inflated invoice).
      inflation_action_probability: 1
    triad_bypass:
      probability: 0.05
    shadow_payroll:
      probability: 0.05
    expense_laundering:
      probability: 0.05
    payroll_tax_diversion:
      probability: 0.05
    inventory_manipulation:
      probability: 0.03
    related_party_abuse:
      probability: 0.03
    circular_cash_flow:
      probability: 0.03
    perpetrator_reuse_probability: 0.30
    max_schemes_per_perpetrator: 3

    # Disabled (Single-FEC scope): Circular Funding, Phantom Warehousing, Intercompany Wash Trades.
    circular_funding:
      probability: 0.0
    phantom_warehousing:
      probability: 0.0
    intercompany_wash_trade:
      probability: 0.0
 
  # High-level definition of which master data entities are potential fraud actors.
  # These are intended to drive selection of *specific* vendors/customers/employees/companies
  # that participate in multi-stage schemes, instead of choosing actors uniformly at random.
  fraud_actors:
    vendors:
      # Approximate share of vendors per company that are part of any fraud scheme.
      share: 0.02          # 2% of vendors flagged as fraudulent
    customers:
      # Approximate share of customers per company that are part of any fraud scheme.
      share: 0.01          # 1% of customers flagged as fraudulent
    employees:
      # Approximate share of employees per company that can act as perpetrators.
      share: 0.02          # 2% of employees flagged as potential fraud actors
    companies:
      # Approximate share of legal entities that participate in intercompany fraud schemes.
      share: 0.10          # 10% of companies considered "high-risk" for schemes
  correlated_injection:
    enabled: true
    fraud_concealment: true
    error_cascade: true
    temporal_clustering: true
    temporal_clustering_config:
      period_end_multiplier: 2.5
      period_end_days: 5
      quarter_end_multiplier: 1.5
      year_end_multiplier: 2.0
    co_occurrence_patterns: []
