# config_multischemes: 10 multi-stage fraud schemes with perpetrator reuse, multipayment (O2C+P2P) and VAT lines.
# Schemes: embezzlement, revenue_manipulation, kickback, triad_bypass, shadow_payroll, expense_laundering,
#          payroll_tax_diversion, inventory_manipulation, related_party_abuse, circular_cash_flow.
# Inspired by config.yaml. Company FR uses VAT standard 20% / reduced 10%.
global:
  seed: null
  industry: transportation
  start_date: 2030-01-01
  period_months: 36
  group_currency: EUR
  parallel: true
  worker_threads: 0
  memory_limit_mb: 0
